services:
  llama-server:
    build:
      context: .
      target: serve
    ports:
      - "127.0.0.1:9931:9931"
    environment:
      - LLAMA_ARG_MODEL=${LLAMA_ARG_MODEL:-/models/Qwen3.5-9B-Q4_K_M.gguf}
      - LLAMA_ARG_MMPROJ=${LLAMA_ARG_MMPROJ:-/models/mmproj-Qwen3.5-9B-F16.gguf}
      - LLAMA_ARG_HOST=${LLAMA_ARG_HOST:-0.0.0.0}
      - LLAMA_ARG_PORT=${LLAMA_ARG_PORT:-9931}
      - LLAMA_ARG_CORS_ORIGINS=${LLAMA_ARG_CORS_ORIGINS:-http://localhost:9931}
      - LLAMA_ARG_N_GPU_LAYERS=${LLAMA_ARG_N_GPU_LAYERS:-all}
      - LLAMA_ARG_THREADS=${LLAMA_ARG_THREADS:-16}
      - LLAMA_ARG_FIT=${LLAMA_ARG_FIT:-off}
      - LLAMA_ARG_FLASH_ATTN=${LLAMA_ARG_FLASH_ATTN:-on}
      - LLAMA_ARG_MMPROJ_OFFLOAD=${LLAMA_ARG_MMPROJ_OFFLOAD:-off}
      - LLAMA_ARG_IMAGE_MIN_TOKENS=${LLAMA_ARG_IMAGE_MIN_TOKENS:-1024}
      - LLAMA_ARG_ALIAS=${LLAMA_ARG_ALIAS:-Qwen3.5:9B (Q4_K_M)}
      - LLAMA_ARG_UI=${LLAMA_ARG_UI:-off}
      - LLAMA_ARG_TEMPERATURE=${LLAMA_ARG_TEMPERATURE:-0.6}
      - LLAMA_ARG_TOP_P=${LLAMA_ARG_TOP_P:-0.95}
      - LLAMA_ARG_TOP_K=${LLAMA_ARG_TOP_K:-20}
      - LLAMA_ARG_MIN_P=${LLAMA_ARG_MIN_P:-0.0}
      - LLAMA_ARG_PRESENCE_PENALTY=${LLAMA_ARG_PRESENCE_PENALTY:-0.0}
      - LLAMA_ARG_REPEAT_PENALTY=${LLAMA_ARG_REPEAT_PENALTY:-1.0}
      - LLAMA_ARG_CTX_SIZE=${LLAMA_ARG_CTX_SIZE:-112128}
      - LLAMA_ARG_CACHE_TYPE_K=${LLAMA_ARG_CACHE_TYPE_K:-q8_0}
      - LLAMA_ARG_CACHE_TYPE_V=${LLAMA_ARG_CACHE_TYPE_V:-q8_0}
    volumes:
      - ./models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - llama-net
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    volumes:
      - ./data/open-webui:/app/backend/data
    environment:
      - WEBUI_URL=${WEBUI_URL:-http://localhost:3000}
      - CORS_ALLOW_ORIGIN=${CORS_ALLOW_ORIGIN:-http://localhost:3000}
      - WEBUI_AUTH_TRUSTED_EMAIL_HEADER=Cf-Access-Authenticated-User-Email
      - WEBUI_AUTH_SIGNOUT_REDIRECT_URL=${WEBUI_AUTH_SIGNOUT_REDIRECT_URL:-http://localhost:3000}
      - ENABLE_LOGIN_FORM=${ENABLE_LOGIN_FORM:-False}
      - ENABLE_PASSWORD_CHANGE_FORM=${ENABLE_LOGIN_FORM:-False}
      - WEBUI_ADMIN_EMAIL
      - DEFAULT_USER_ROLE=${DEFAULT_USER_ROLE:-user}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - HF_HUB_VERBOSITY=${HF_HUB_VERBOSITY:-error}
      - ENABLE_OLLAMA_API=${ENABLE_OLLAMA_API:-False}
      - ENABLE_OPENAI_API=${ENABLE_OPENAI_API:-True}
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-http://llama-server:9931/v1}
      - DEFAULT_MODELS=${DEFAULT_MODELS:-Qwen3.5:9B (Q4_K_M)}
      - DEFAULT_PINNED_MODELS=${DEFAULT_PINNED_MODELS:-Qwen3.5:9B (Q4_K_M)}
      - BYPASS_MODEL_ACCESS_CONTROL=${BYPASS_MODEL_ACCESS_CONTROL:-True}
      - ENABLE_WEB_SEARCH=${ENABLE_WEB_SEARCH:-True}
      - WEB_SEARCH_ENGINE=${WEB_SEARCH_ENGINE:-tavily}
      - WEB_LOADER_ENGINE=${WEB_LOADER_ENGINE:-tavily}
      - TAVILY_API_KEY
    ports:
      - "127.0.0.1:3000:8080"
    networks:
      - llama-net
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN
    command: tunnel --no-autoupdate run
    networks:
      - llama-net
networks:
  llama-net:
    driver: bridge
